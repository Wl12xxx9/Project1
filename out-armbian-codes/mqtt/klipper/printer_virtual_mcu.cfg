[mcu]
# 虚拟MCU套接字路径，与启动命令 /tmp/klipper_host_mcu 对应
serial: /tmp/klipper_host_mcu
# 虚拟MCU不支持restart_method，已移除
# canbus_uuid: 2dc7a3ac3edd

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 25000
max_z_velocity: 25
max_z_accel: 1000

# ========= X轴 FOC1 =========
[stepper_x]
# 原STM32硬件引脚替换为虚拟GPIO，功能逻辑不变
step_pin: gpio0
dir_pin: !gpio1
enable_pin: !gpio2
endstop_pin: ^gpio3
# 新增：新版Klipper必填参数，限位在最小坐标端
position_endstop: min
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
position_min: 0
position_max: 200
homing_speed: 50

# 虚拟MCU无TMC硬件UART，原驱动配置已注释
# [tmc2209 stepper_x]
# uart_pin: PA9
# run_current: 0.8
# hold_current: 0.4
# diag_pin: ^PA3

# ========= Y轴 FOC2 =========
[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
endstop_pin: ^gpio7
position_endstop: min
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
position_min: 0
position_max: 200
homing_speed: 50

# [tmc2209 stepper_y]
# uart_pin: PA9
# run_current: 0.8
# hold_current: 0.4
# diag_pin: ^PC2

# ========= Z轴 FOC3 =========
[stepper_z]
step_pin: gpio8
dir_pin: !gpio9
enable_pin: !gpio10
endstop_pin: ^gpio11
position_endstop: min
rotation_distance: 8
microsteps: 16
full_steps_per_rotation: 200
position_min: 0
position_max: 200
homing_speed: 10

# [tmc2209 stepper_z]
# uart_pin: PA9
# run_current: 0.6
# hold_current: 0.3
# diag_pin: ^PC3 

# ========== 挤出机 ==========
[extruder]
step_pin: gpio12
dir_pin: !gpio13
enable_pin: !gpio14
rotation_distance: 33.5
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.4
filament_diameter: 1.75
# 加热/传感引脚替换为虚拟IO
heater_pin: gpio15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: adc0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 260

# ========== 热床 ==========
[heater_bed]
heater_pin: gpio16
sensor_type: EPCOS 100K B57560G104F
sensor_pin: adc1
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 110

# ========== 风扇 ==========
[fan]
pin: gpio17
kick_start_time: 0.1
off_below: 0.1

[heater_fan nozzle_cooling_fan]
pin: gpio18
heater: extruder
heater_temp: 50.0
max_power: 1.0

# ==============================================
# 适配虚拟MCU的修改说明
# 1. 所有STM32硬件引脚（PA/PB/PC/PD/PE）替换为独立虚拟GPIO/ADC编号，无硬件冲突
# 2. 移除全部TMC2209驱动段，虚拟环境无硬件UART外设
# 3. X/Y/Z三轴新增 position_endstop: min，满足新版Klipper必填校验
# 4. 移除[mcu]段 restart_method 参数，Linux虚拟MCU不支持该配置
# 5. 运动、温控、尺寸等业务参数与原硬件配置100%一致，验证结果可直接复用
# ==============================================