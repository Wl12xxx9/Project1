[screws_tilt_adjust]
screw1: 50,50
screw1_name: front left
screw2: 280,50
screw2_name: front right
screw3: 280,280
screw3_name: back right
screw4: 50,280
screw4_name: back left
speed: 50.0
screw_thread: CW-M3
horizontal_move_z: 5

[bed_mesh]
speed: 100    # XY移动速度
mesh_min: 30, 30
mesh_max: 280, 260
mesh_pps: 2, 2  # 检测点之间的插值
algorithm: bicubic
probe_count: 50, 50
zero_reference_position: 50, 50

[servo my_servo]
# pin: PE9
pin: PB10
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 180

[gcode_macro SERVO_OPEN]
gcode:
    SET_PIN PIN=probe_reset_pin VALUE=1
    SET_SERVO SERVO=my_servo angle=0

[gcode_macro SERVO_CLOSE]
gcode:
    SET_PIN PIN=probe_reset_pin VALUE=1
    SET_SERVO SERVO=my_servo angle=180

[gcode_macro TEST_RESUME]
gcode:
    ALLOW_OFF_RESUME

[output_pin led]
pin: PB4
value: 1

[neopixel my_neopixel_1]
# pin: host:gpiochip1/gpio1
pin: PE4
chain_count: 20

[neopixel my_neopixel_2]
pin: host:gpiochip0/gpio19
chain_count: 4

[gcode_button host_sw]
pin: !host:gpiochip0/gpio18
press_gcode:
    M118 host_sw ON!
release_gcode:
    M118 host_sw OFF!

[gcode_button door_sw]
pin: !PE3
press_gcode:
    M118 door_sw ON!
release_gcode:
    M118 door_sw OFF!

