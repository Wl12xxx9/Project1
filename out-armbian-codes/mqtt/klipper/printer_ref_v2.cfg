[homing_override]
gcode:
    BED_MESH_CLEAR
    {% if printer.toolhead.homed_axes != 'xyz' %}
        SET_GCODE_OFFSET Z=0
        SET_KINEMATIC_POSITION Z=0
        M400
        G90
        G0 Z10 F600
    {% else %}
        {% if printer.toolhead.position.z < 10 %}
            G90
            G0 Z10 F600
        {% endif %}
    {% endif %}

    # {% if printer.toolhead.position.z + 10 < printer.configfile.settings.stepper_z.position_max %}
    #     G90
    #     G0 Z10 F600
    # {% endif %}
    # {% if (printer.gcode_move.position.z + 10) < printer.toolhead.axis_maximum.z %}
    #     G90
    #     G0 Z10 F600
    # {% endif %}
    SET_VELOCITY_LIMIT VELOCITY=50 ACCEL=10000 ACCEL_TO_DECEL=5000
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    
    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}

    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}
    
    {% if home_all or 'Z' in params %}
        _HOME_Z
        SET_Z_FROM_PROBE
    {% endif %}

    # G1 X150 Y150 F6000
    # G1 Z0 F2000
    SET_VELOCITY_LIMIT VELOCITY=600 ACCEL=25000 ACCEL_TO_DECEL=12500
    BED_MESH_PROFILE LOAD="default"
    M400


[gcode_macro _HOME_X]
gcode:
    G91
    G1 X5 Y5 F3000
    # G1 X2 F3000
    M400
    G90
    # Home

    G28 X
    G1 X15 F3000
    G1 X2 F3000
    G28 X
    M400


[gcode_macro _HOME_Y]
gcode:
    # Move away
    G91
    G1 X50 F3000
    # # G1 Y2 F3000
    M400
    G90

    # Home
    G28 Y
    G1 Y15 F3000
    G1 Y2 F3000
    G28 Y
    G1 X15 Y15 F7200
    M400


[gcode_macro _HOME_Z]
gcode:
    {% set button = printer['gcode_button main_sw'] %}
    {% set nozzle = printer.save_variables.variables.current_extruder|default(-1)|int %}
    # M118 喷嘴{nozzle}进行切换
    SET_VELOCITY_LIMIT VELOCITY=600 ACCEL=25000 ACCEL_TO_DECEL=12500
    {% if button.state != 'PRESSED' %}
        SET_SERVO SERVO=my_servo angle=0
        G4 P2000
        M488 T0
        {% set nozzle = 0 %}
    {% endif %}
    G90
    G1 X150 Y150 F6000
    SET_VELOCITY_LIMIT VELOCITY=50 ACCEL=2000 ACCEL_TO_DECEL=1000
    G28 Z
    {% if nozzle > 0 %}
        {% set z_off = printer.save_variables.variables['offset_z' ~ nozzle]|default(0)|float %}
        SET_GCODE_OFFSET Z={z_off}
    {% endif %}
    # G1 Z10
    SET_VELOCITY_LIMIT VELOCITY=600 ACCEL=25000 ACCEL_TO_DECEL=12500

[gcode_button main_sw]
pin: PD1
# debounce_delay:0.5
press_gcode:
    M118 main_sw ON!
release_gcode:
    M118 main_sw OFF!

