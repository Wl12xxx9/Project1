[include fluidd.cfg]

[idle_timeout]
timeout: 36000

[mcu]
canbus_uuid:40794ac2ee21


[mcu host]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 25000
max_z_velocity: 25
max_z_accel: 1000

[temperature_sensor FLY-Pi]
sensor_type: temperature_host

# Motor1
[stepper_x]
step_pin: PE0
dir_pin: !PE1
enable_pin: !PE5
microsteps: 16
rotation_distance: 39
endstop_pin: !PE6
position_endstop: 0
position_max: 350
position_min: -20
homing_speed: 50
homing_retract_dist:0

# Motor2
[stepper_y]
step_pin: PA0
dir_pin: !PA1
enable_pin: !PA2
microsteps: 16
rotation_distance: 39
endstop_pin: !PA3
position_endstop: 0
position_min: -20
position_max: 350
homing_speed: 50
homing_retract_dist:0

# Motor3
[stepper_z]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PC15
microsteps: 16
rotation_distance: 8
gear_ratio: 3:1
endstop_pin: !PC3
position_endstop: 0
position_max: 280
position_min: -25
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 0

[extruder]
step_pin: PE9
dir_pin: !PE10
enable_pin: PE13
microsteps: 16
rotation_distance: 63.5
nozzle_diameter: 0.4
filament_diameter: 1.75
gear_ratio: 1408:189
pressure_advance: 0.020
heater_pin: PE11
sensor_pin: PE12
sensor_type: Generic 3950
max_power: 0.8
control: pid
pid_Kp: 11.095
pid_Ki: 2.079
pid_Kd: 20.624
min_temp: -220
max_temp: 350
min_extrude_temp: -220
max_extrude_only_accel: 5000
max_extrude_only_velocity: 100
max_extrude_only_distance: 20000
max_extrude_cross_section: 20000

[verify_heater extruder]
max_error: 120
check_gain_time:60
hysteresis: 20
heating_gain: 2

[heater_fan extruder_fan]
pin: PE15
heater: extruder
heater_temp: 80.0
# fan_speed: 0.8
shutdown_speed: 0

[gcode_button extruder_sw]
pin: PD3
press_gcode:
    M118 T0 ON!
release_gcode:
